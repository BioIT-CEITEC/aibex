[project]
name = "aibex"
version = "0.1.0"
description = "Aibex View – prompt-editable visualisation of bioinformatics results"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "duckdb>=1.1",
  "polars>=1.0",
  "pyarrow>=16",
  "openai>=1.40",
  "jsonpatch>=1.33",
  "python-dotenv>=1.0",
  "sse-starlette>=2.1",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aibex"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "phase1: acceptance tests for phase 1 (bundles, spec, panel data)",
  "phase2: acceptance tests for phase 2 (sessions, chat loop)",
  "phase3: acceptance tests for phase 3 (ADAR2 bundle)",
  "phase4: acceptance tests for phase 4 (Level 2 widgets)",
  "live: calls the real e-INFRA LLM; runs only with -m live (make accept-live)",
]
